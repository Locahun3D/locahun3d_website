  var cls = p.ph ? 'card ph' : (p.soon ? 'card soon' : 'card live');
  if(p.ph || p.soon || !p.href) return '<div class="'+cls+'" data-tag="'+p.tag+'">'+inner+'</div>';
  return '<a class="'+cls+'" href="'+p.href+'" data-tag="'+p.tag+'">'+inner+'</a>';
}
function renderBlog(f){
  document.getElementById('blogGrid').innerHTML = POSTS.filter(function(p){return f==='all'||p.tag===f;}).map(blogCard).join('');
  observeFades();
  if(window.__budoux) window.__budoux(document.getElementById('blogGrid'));
}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.1});
function observeFades(){document.querySelectorAll('.fade').forEach(function(el){io.observe(el);});}
renderBlog('all');
observeFades();
document.getElementById('filters').addEventListener('click',function(e){
  var b=e.target.closest('.chip'); if(!b) return;
  document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});
  b.classList.add('active'); renderBlog(b.dataset.f);
});

function syncNav(){
  var y = window.scrollY || document.documentElement.scrollTop;
  var blogTop = document.getElementById('blog').offsetTop - 120;
  var atBlog = y >= blogTop;
  document.querySelectorAll('.works-subnav a[href="#works"], .works-subnav a[href="#blog"]').forEach(function(a){
    a.classList.toggle('cur', (a.getAttribute('href')==='#blog') === atBlog);
  });
}
document.addEventListener('scroll', syncNav, {passive:true});
syncNav();
</script>

<!-- BudouX：日本語を文節単位で改行（中途半端な折返しを防ぐ） -->
<script type="module">
  import { loadDefaultJapaneseParser } from 'https://cdn.jsdelivr.net/npm/budoux@0.8.4/+esm';
  const bp = loadDefaultJapaneseParser();
  const SEL = '.hero h1,.hero p,.section-head h2,.section-head p,.card h2,.card h3,.card p';
  function apply(root){ (root||document).querySelectorAll(SEL).forEach(function(el){ try{ el.setAttribute('data-budoux',''); bp.applyToElement(el); }catch(e){} }); }
  window.__budoux = apply;
  apply();
</script>
